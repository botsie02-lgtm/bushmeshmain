name: Apply simulator link-state identity fix

on:
  push:
    branches:
      - test/network-simulator-v1
    paths:
      - '.github/workflows/network-simulator-linkstate-patch.yml'

permissions:
  contents: write

jobs:
  patch-link-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/network-simulator-v1
      - name: Preserve LinkState identity across quality updates
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('src/bushmesh/testing/networkSimulator/DeterministicNetworkSimulator.ts')
          text = path.read_text()
          pattern = re.compile(
              r"    this\.links\.set\(key, \{\n"
              r"\s+config,\n"
              r"\s+queue: existing\?\.queue \?\? \[\],\n"
              r"\s+queueBytes: existing\?\.queueBytes \?\? 0,\n"
              r"\s+busy: existing\?\.busy \?\? false,\n"
              r"\s+\}\);"
          )
          replacement = '''    if (existing) {
              // Scheduled transmission completions retain this object identity.
              // Mutating config prevents a live RSSI/SNR update from stranding
              // the replacement link in a permanently busy state.
              existing.config = config;
            } else {
              this.links.set(key, {
                config,
                queue: [],
                queueBytes: 0,
                busy: false,
              });
            }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one LinkState replacement block, replaced {count}')
          path.write_text(text)
          PY
      - name: Commit simulator-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bushmesh/testing/networkSimulator/DeterministicNetworkSimulator.ts
          git commit -m "fix(sim): preserve busy link state identity"
          git push origin HEAD:test/network-simulator-v1
