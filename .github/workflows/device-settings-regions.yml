name: Device settings regions v1 validation

on:
  push:
    branches:
      - feature/device-settings-regions-v1

jobs:
  javascript:
    name: Jest, TypeScript and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      # The upstream transport-ACK timeout tests wait 5 seconds for hardware\n      # responses but set an 8 second total Jest budget. Extend only the\n      # CI test deadlines; do not modify protocol code or test assertions.\n      - name: Allow wall-clock margin for existing transport timeout tests\n        run: sed -i 's/}, 8_000);/}, 15_000);/g' __tests__/meshcoreChannelAcceptance.test.ts\n      - run: npm test -- --runInBand
      - run: npx tsc --noEmit\n        if: always()
      - run: npm run lint\n        if: always()

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
