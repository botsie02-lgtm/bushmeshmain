name: Wave 5 offline navigation (feature branch)
on:
  push:
    branches:
      - feature/wave5-offline-navigation-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  js-and-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: python -m pip install -r tools/maps/requirements.txt
      - run: python -m unittest discover -s tools/maps -p 'test_*.py'
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Raise Gradle bootstrap timeout (CI-only)
        run: sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build Android and execute unit fixtures
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
