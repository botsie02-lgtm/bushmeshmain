name: Wave 5 field experience v1

on:
  push:
    branches:
      - feature/wave5-field-experience-v1
  workflow_dispatch:

concurrency:
  group: wave5-field-experience-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Jest · TypeScript · ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Jest all suites
        run: npm test -- --runInBand
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint

  android:
    name: Android assembleDebug · no device install
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Compile debug APK without installing on any device
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Retain isolated debug artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: bushmesh-wave5-field-experience-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
