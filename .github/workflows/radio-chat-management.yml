name: Radio chat management validation
on:
  push:
    branches:
      - feature/radio-chat-management-v1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radio-chat-management-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit
      - run: npm run lint
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug :app:testDebugUnitTest --no-daemon
