name: BushMesh Protocol Checks

on:
  push:
    branches:
      - feature/bushmesh-lora-protocol
    paths:
      - 'src/bushmesh/**'
      - 'src/meshcore/**'
      - '__tests__/bushmesh*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/bushmesh-protocol.yml'
  pull_request:
    paths:
      - 'src/bushmesh/**'
      - 'src/meshcore/**'
      - '__tests__/bushmesh*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

jobs:
  protocol-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: BushMesh protocol tests
        run: npm test -- --runInBand --testPathPattern=bushmesh
