name: BushMesh Protocol Checks

on:
  push:
    branches:
      - feature/bushmesh-lora-protocol
    paths:
      - 'App.tsx'
      - 'src/bushmesh/**'
      - 'src/meshcore/**'
      - 'src/screens/**'
      - 'src/state/**'
      - 'android/app/src/main/java/com/bushmeshmain/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/bushmesh-protocol.yml'
  pull_request:
    paths:
      - 'App.tsx'
      - 'src/bushmesh/**'
      - 'src/meshcore/**'
      - 'src/screens/**'
      - 'src/state/**'
      - 'android/app/src/main/java/com/bushmeshmain/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

concurrency:
  group: bushmesh-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Full Jest suite
        run: npm test -- --runInBand
