name: Bushmesh CI

on:
  push:
    branches:
      - main
      - foundation/**
      - integration/**
  pull_request:
    branches:
      - main

concurrency:
  group: bushmesh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --runInBand

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Isolated deterministic simulator compile
        run: npx tsc -p tsconfig.network-simulator-v1.json --noEmit

      - name: Install synthetic MBTiles fixture dependencies
        run: python -m pip install "Pillow>=11,<14"

      - name: Generate and inspect deterministic MBTiles raster fixture
        run: python -m unittest discover -s tools/maps -p 'test_*.py'

  android-debug:
    if: startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Native raster reader JVM fixtures
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Publish Wave 3 unified physical-test APK
        uses: actions/upload-artifact@v4
        with:
          name: bushmesh-wave3-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
