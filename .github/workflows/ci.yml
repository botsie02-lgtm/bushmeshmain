name: Bushmesh CI

on:
  push:
    branches:
      - main
      - foundation/**
      - integration/**
  pull_request:
    branches:
      - main

concurrency:
  group: bushmesh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wave 4 pre-activation security and ownership guard
        if: github.ref == 'refs/heads/integration/bushmesh-wave4-staging' || github.ref == 'refs/heads/integration/bushmesh-wave5-staging'
        run: python3 tools/integration/wave4_security_gate.py

      - name: Wave 5 explicit channel-only and excluded security guard
        if: github.ref == 'refs/heads/integration/bushmesh-wave5-staging'
        run: python3 tools/integration/wave5_security_gate.py

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Wave 4 critical regression suites
        if: github.ref == 'refs/heads/integration/bushmesh-wave4-staging' || github.ref == 'refs/heads/integration/bushmesh-wave5-staging'
        run: |
          npx jest --runInBand \
            __tests__/radioSessionNativeLifecycleAuthority.test.tsx \
            __tests__/appShellNavigation.test.tsx \
            __tests__/gpsFieldDiagnostics.test.ts \
            __tests__/convoyMapRendering.test.tsx \
            __tests__/wave2AuthenticatedPositionIngress.test.ts \
            __tests__/wave3SecurityActivationGate.test.ts \
            __tests__/convoyEnrolmentSecurityV3.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Isolated deterministic simulator compile
        run: npx tsc -p tsconfig.network-simulator-v1.json --noEmit

      - name: Publish Wave 5 deterministic traces and host benchmarks
        if: github.ref == 'refs/heads/integration/bushmesh-wave5-staging'
        uses: actions/upload-artifact@v4
        with:
          name: bushmesh-wave5-field-reliability-${{ github.sha }}
          path: artifacts/wave5-field-reliability/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Install synthetic MBTiles fixture dependencies
        run: python -m pip install "Pillow>=11,<14"

      - name: Generate and inspect deterministic MBTiles raster fixture
        run: python -m unittest discover -s tools/maps -p 'test_*.py'

  android-debug:
    if: startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Native JVM fixtures (raster; future security providers must add tests)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Record debug APK SHA-256
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256SUMS

      - name: Publish staging debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bushmesh-wave5-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # React Native debug variants omit the JS bundle and need Metro.
      # This separate debug-key-signed RELEASE variant carries offline JS
      # for Galaxy S22+ testing; it is NOT production signed or certified.
      - name: Assemble self-contained Wave 4 staging field-test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify VIEW PACK is embedded in standalone APK bytecode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          assert apk.is_file(), 'Standalone field-test APK missing'
          with ZipFile(apk) as archive:
              assert archive.testzip() is None, 'APK ZIP entry corrupted'
              assert 'assets/index.android.bundle' in archive.namelist(), 'Missing embedded React Native JS bundle'
              bundle = archive.read('assets/index.android.bundle')
              assert len(bundle) > 10000, 'Unexpectedly tiny JS bundle'
              assert b'VIEW PACK' in bundle or 'VIEW PACK'.encode('utf-16-le') in bundle, (
                  'Map VIEW PACK control not found in bundled Hermes JavaScript'
              )
              assert any(name.endswith('.dex') for name in archive.namelist()), 'Missing Android bytecode'
              print(f'Validated standalone APK: {apk.stat().st_size} bytes; embedded JS: {len(bundle)} bytes; VIEW PACK present')
          PY

      - name: Record standalone APK SHA-256 and build provenance
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk | tee SHA256SUMS
          printf 'commit=%s\\nrun=%s\\nvariant=release-debug-key-signed\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD_PROVENANCE.txt
          cat BUILD_PROVENANCE.txt

      - name: Publish standalone offline Wave 5 staging field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: bushmesh-wave5-standalone-fieldtest-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS
            android/app/build/outputs/apk/release/BUILD_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14
