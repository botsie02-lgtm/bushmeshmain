name: Bushmesh CI

on:
  push:
    branches:
      - main
      - foundation/**
      - integration/**
  pull_request:
    branches:
      - main

concurrency:
  group: bushmesh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --runInBand

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Isolated deterministic simulator compile
        run: npx tsc -p tsconfig.network-simulator-v1.json --noEmit

      - name: Install synthetic MBTiles fixture dependencies
        run: python -m pip install "Pillow>=11,<14"

      - name: Generate and inspect deterministic MBTiles raster fixture
        run: python -m unittest discover -s tools/maps -p 'test_*.py'

  android-debug:
    if: startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Native raster reader JVM fixtures
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Publish Wave 3 unified physical-test APK
        uses: actions/upload-artifact@v4
        with:
          name: bushmesh-wave3-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # React Native debug variants omit the JS bundle and need Metro.
      # This separate debug-key-signed RELEASE variant carries offline JS
      # for Galaxy S22+ testing; it is NOT production signed or certified.
      - name: Assemble self-contained Wave 3 field-test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify VIEW PACK is embedded in standalone APK bytecode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          assert apk.is_file(), 'Standalone field-test APK missing'
          with ZipFile(apk) as archive:
              assert archive.testzip() is None, 'APK ZIP entry corrupted'
              assert 'assets/index.android.bundle' in archive.namelist(), 'Missing embedded React Native JS bundle'
              bundle = archive.read('assets/index.android.bundle')
              assert len(bundle) > 10000, 'Unexpectedly tiny JS bundle'
              assert b'VIEW PACK' in bundle or 'VIEW PACK'.encode('utf-16-le') in bundle, (
                  'Map VIEW PACK control not found in bundled Hermes JavaScript'
              )
              assert any(name.endswith('.dex') for name in archive.namelist()), 'Missing Android bytecode'
              print(f'Validated standalone APK: {apk.stat().st_size} bytes; embedded JS: {len(bundle)} bytes; VIEW PACK present')
          PY

      - name: Publish standalone offline Wave 3 field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: bushmesh-wave3-standalone-fieldtest-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
