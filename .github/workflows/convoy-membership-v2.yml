name: Convoy membership v2 validation
on:
  push:
    branches:
      - feature/convoy-membership-v2
  workflow_dispatch:

concurrency:
  group: convoy-membership-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Jest full suite
        run: npm test -- --runInBand
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
