name: Wave 5 field-location sharing isolated validation
on:
  push:
    branches:
      - feature/wave5-field-location-sharing-v1
  workflow_dispatch:

concurrency:
  group: bushmesh-wave5-field-location
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Wave 5 isolated tests
        run: npm test -- --runInBand __tests__/wave5ChannelFieldLocation.test.ts __tests__/wave5VerifiedLocationBoundary.test.ts
      - name: Full Jest regression
        run: npm test -- --runInBand
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Increase CI-only Gradle wrapper timeout
        run: sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
