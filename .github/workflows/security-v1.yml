name: Security v1

on:
  push:
    branches:
      - foundation/security-identity-v1
  pull_request:
    paths:
      - 'src/security/**'
      - '__tests__/**'
      - 'docs/SECURITY_*.md'
      - '.eslintrc.security.js'
      - '.github/workflows/security-v1.yml'
  workflow_dispatch:

jobs:
  security-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Jest security suites
        run: >-
          npx jest --runInBand --runTestsByPath
          __tests__/directSession.test.ts
          __tests__/groupSecurity.test.ts
          __tests__/identityTrustPairing.test.ts
          __tests__/securityPersistenceHardening.test.ts
          __tests__/securityVectors.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint security contract
        run: >-
          npx eslint -c .eslintrc.security.js
          src/security
          __tests__/directSession.test.ts
          __tests__/groupSecurity.test.ts
          __tests__/identityTrustPairing.test.ts
          __tests__/securityPersistenceHardening.test.ts
          __tests__/securityTestHelpers.ts
          __tests__/securityVectors.test.ts
          --max-warnings=0
